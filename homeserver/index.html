<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>استبيان للسيرفر بتاعي الصغنون </title>
</head>

<body style="font-size:28px; direction:rtl">

<h2>استبيان من احمد وليد</h2>

الاسم:<br>
<input type="text" id="name" required><br><br>

اختر الاستخدام:<br>
<input type="radio" name="d" value="Media Center"> سيرفر لحفظ الوسائط<br>
<input type="radio" name="d" value="Server"> سيرفر لحفظ البيانات<br>
<input type="radio" name="d" value="like_Whats.app"> برنامج يشبه واتساب<br>
<input type="radio" name="d" value="pray_time">برنامج لتذكير الصلاة <br>
<input type="radio" name="d" value="not needed">طز.<br>
<input type="radio" name="d" value="Other"> آخر
<input type="text" id="other"><br><br>

<button type="button" onclick="send()">إرسال</button>

</form>

<script>
async function send() {

    const name = document.getElementById("name").value.trim();
    if (name === "") {
        alert("ادخل الاسم");
        return;
    }

    let choice = "";
    for (const r of document.getElementsByName("d")) {
        if (r.checked) choice = r.value;
    }

    if (choice === "") {
        alert("اختر خيار");
        return;
    }

    if (choice === "Other") {
        choice = document.getElementById("other").value.trim();
    }

    const payload = {
        name: name,
        choice: choice
    };

    await fetch("/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    document.getElementById("f").reset();
    alert("تم الحفظ");
}
</script>

</body>
</html>
